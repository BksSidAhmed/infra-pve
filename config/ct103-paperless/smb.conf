[global]
   workgroup = WORKGROUP
   server string = Paperless
   server role = standalone server
   map to guest = never
   server min protocol = SMB2
   log file = /var/log/samba/log.%m
   max log size = 1000
   disable netbios = no

[scan]
   comment = Depot Paperless (scanner)
   path = /mnt/docs/consume/Scanner
   valid users = scanner
   writable = yes
   force user = paperless
   force group = paperless
   create mask = 0664
   directory mask = 0775


[non-pris-en-charge]
   comment = Fichiers que Paperless ne lit pas (Word, PowerPoint...)
   path = /mnt/docs/non-pris-en-charge
   valid users = scanner
   writable = yes
   force user = paperless
   force group = paperless
