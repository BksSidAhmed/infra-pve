services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "80:3000"
    env_file: .env
    environment:
      HOMEPAGE_ALLOWED_HOSTS: 192.168.1.104,accueil.home,localhost:3000
    volumes:
      - ./config:/app/config
