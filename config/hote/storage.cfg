dir: local
	path /var/lib/vz
	content import,vztmpl,backup,iso

lvmthin: local-lvm
	thinpool data
	vgname pve
	content images,rootdir

zfspool: Disque1
	pool Disque1
	content rootdir,images
	mountpoint /Disque1
	nodes pve

dir: backups
	path /Disque1/backups
	content backup

zfspool: Disque2
	pool Disque2
	content images,rootdir
	mountpoint /Disque2

